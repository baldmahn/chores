<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChorePro Matrix</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        dashboard: {
                            bg: '#f8fafc',      /* Slate 50 */
                            card: '#ffffff',
                            border: '#e2e8f0',  /* Slate 200 */
                            text: '#0f172a',    /* Slate 900 */
                            muted: '#64748b',   /* Slate 500 */
                            primary: '#334155', /* Slate 700 */
                            success: '#10b981', /* Emerald 500 */
                            danger: '#ef4444',  /* Red 500 */
                            warning: '#f59e0b', /* Amber 500 */
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: theme('colors.dashboard.bg');
            color: theme('colors.dashboard.text');
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .custom-scrollbar::-webkit-scrollbar { height: 8px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: theme('colors.slate.100'); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: theme('colors.slate.300'); border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: theme('colors.slate.400'); }

        .sticky-col {
            position: sticky;
            left: 0;
            background-color: white;
            z-index: 10;
            /* subtle right shadow for depth when scrolling */
            box-shadow: 2px 0 5px -2px rgba(0,0,0,0.05); 
        }
        
        .sticky-header {
            position: sticky;
            left: 0;
            background-color: theme('colors.slate.50');
            z-index: 20;
            box-shadow: 2px 0 5px -2px rgba(0,0,0,0.05);
        }

        /* Checkbox Box Animation */
        @keyframes pop {
            0% { transform: scale(0.80); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .check-anim { animation: pop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        /* Accordion transition */
        .accordion-content {
            transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out, padding 0.3s ease-in-out;
            max-height: 0; opacity: 0; overflow: hidden; padding-top: 0; padding-bottom: 0;
        }
        .accordion-content.open {
            max-height: 800px; opacity: 1; padding-top: 1.5rem; padding-bottom: 1.5rem; overflow-y: visible;
        }
        .accordion-icon { transition: transform 0.3s ease; }
        .accordion-icon.open { transform: rotate(180deg); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-8 px-4 sm:px-6">

    <main class="w-full max-w-5xl flex flex-col gap-6">
        
        <!-- Header -->
        <header class="flex items-center justify-between bg-white p-5 rounded-xl border border-dashboard-border shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg bg-slate-900 flex items-center justify-center text-white shadow-sm">
                    <i class="ph ph-squares-four text-2xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-xl leading-tight text-dashboard-text">Matrix<span class="text-dashboard-success">Pro</span></h1>
                    <p class="text-xs text-dashboard-muted font-medium uppercase tracking-wider" id="headerDate"></p>
                </div>
            </div>
            <div class="text-right hidden sm:block">
                <p class="text-sm text-dashboard-muted">Storage Active</p>
                <p class="text-sm font-semibold text-dashboard-success flex items-center justify-end gap-1">
                    <span class="w-2 h-2 rounded-full bg-dashboard-success animate-pulse"></span> Local Linked
                </p>
            </div>
        </header>

        <!-- TOP SECTION: Category Toggle -->
        <section class="bg-white rounded-xl border border-dashboard-border shadow-sm overflow-hidden flex flex-col">
            
            <div class="bg-slate-50 border-b border-dashboard-border p-3 flex overflow-x-auto no-scrollbar justify-start sm:justify-center">
                <div class="inline-flex bg-slate-200/70 p-1 rounded-lg gap-1 min-w-max">
                    <button id="toggleDailyBtn" onclick="setActiveType('daily')" class="px-4 py-1.5 rounded-md text-sm font-medium transition-all text-dashboard-muted hover:text-dashboard-text whitespace-nowrap">
                        <i class="ph ph-sun text-amber-500 mr-1"></i> Daily
                    </button>
                    <button id="toggleHouseholdBtn" onclick="setActiveType('household')" class="px-4 py-1.5 rounded-md text-sm font-medium transition-all text-dashboard-muted hover:text-dashboard-text whitespace-nowrap">
                        <i class="ph ph-house text-dashboard-success mr-1"></i> Household
                    </button>
                    <button id="toggleAdminBtn" onclick="setActiveType('admin')" class="px-4 py-1.5 rounded-md text-sm font-medium transition-all text-dashboard-muted hover:text-dashboard-text whitespace-nowrap">
                        <i class="ph ph-briefcase text-blue-500 mr-1"></i> Admin
                    </button>
                    <button id="toggleMaintenanceBtn" onclick="setActiveType('maintenance')" class="px-4 py-1.5 rounded-md text-sm font-medium transition-all text-dashboard-muted hover:text-dashboard-text whitespace-nowrap">
                        <i class="ph ph-wrench text-dashboard-warning mr-1"></i> Maintenance
                    </button>
                </div>
            </div>

            <!-- THE MATRIX -->
            <div class="flex flex-col relative w-full overflow-hidden">
                <div id="matrixContainer" class="w-full overflow-x-auto custom-scrollbar relative">
                    <!-- Table injected via JS -->
                </div>
            </div>
        </section>

        <!-- BOTTOM SECTION: Accordions -->
        <section class="flex flex-col gap-3">
            
            <!-- Accordion 1: Add New Chore -->
            <div class="bg-white rounded-xl border border-dashboard-border shadow-sm overflow-hidden">
                <button class="w-full px-6 py-4 flex items-center justify-between bg-white hover:bg-slate-50 transition-colors" onclick="toggleAccordion('addChoreAccordion')">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded bg-slate-100 text-slate-600 flex items-center justify-center">
                            <i class="ph ph-plus text-lg"></i>
                        </div>
                        <span class="font-semibold text-dashboard-text">Add New Tracker</span>
                    </div>
                    <i class="ph ph-caret-down text-dashboard-muted accordion-icon" id="addChoreAccordion-icon"></i>
                </button>
                <div id="addChoreAccordion-content" class="accordion-content px-6 border-t border-dashboard-border bg-slate-50/50">
                    <div class="flex flex-col gap-4">
                        <div class="flex flex-wrap gap-4 mb-2">
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="radio" name="choreType" value="daily" checked class="text-amber-500 focus:ring-amber-500 w-4 h-4">
                                <span class="text-sm font-medium text-dashboard-text">Daily</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="radio" name="choreType" value="household" class="text-dashboard-success focus:ring-dashboard-success w-4 h-4">
                                <span class="text-sm font-medium text-dashboard-text">Household (Wkly)</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="radio" name="choreType" value="admin" class="text-blue-500 focus:ring-blue-500 w-4 h-4">
                                <span class="text-sm font-medium text-dashboard-text">Admin (Wkly)</span>
                            </label>
                            <label class="flex items-center gap-2 cursor-pointer">
                                <input type="radio" name="choreType" value="maintenance" class="text-dashboard-warning focus:ring-dashboard-warning w-4 h-4">
                                <span class="text-sm font-medium text-dashboard-text">Maintenance</span>
                            </label>
                        </div>
                        
                        <div class="flex flex-col sm:flex-row gap-4 items-start sm:items-center">
                            <div class="flex-1 w-full relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none h-10">
                                    <i class="ph ph-tag text-slate-400"></i>
                                </div>
                                <input 
                                    type="text" 
                                    id="choreInput" 
                                    class="block w-full pl-10 pr-3 py-2 border border-slate-300 rounded-lg bg-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:border-slate-400 text-sm transition-shadow h-10" 
                                    placeholder="e.g., Vacuum, Check Filter, Read"
                                >
                            </div>
                            <button 
                                id="addChoreBtn"
                                onclick="handleAddChore()"
                                class="w-full sm:w-auto bg-slate-900 hover:bg-slate-800 text-white px-6 py-2 rounded-lg font-medium text-sm transition-colors shadow-sm whitespace-nowrap h-10"
                            >
                                Add to Matrix
                            </button>
                        </div>

                        <!-- Rotation Feature -->
                        <div class="border-t border-slate-200 pt-3 mt-1">
                            <label class="flex items-center gap-2 cursor-pointer mb-3">
                                <input type="checkbox" id="isRotatingCheck" onchange="toggleRotationInput()" class="text-dashboard-primary focus:ring-dashboard-primary w-4 h-4 rounded border-slate-300">
                                <span class="text-sm font-medium text-dashboard-text">This is a rotating chore (cycles through sub-tasks)</span>
                            </label>
                            
                            <div id="rotationInputContainer" class="hidden">
                                <label class="block text-xs font-semibold text-dashboard-muted uppercase tracking-wider mb-1.5">Enter sub-tasks in order (one per line)</label>
                                <textarea id="rotationInput" rows="3" class="w-full p-3 border border-slate-300 rounded-lg bg-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-dashboard-primary focus:border-dashboard-primary text-sm transition-shadow resize-none" placeholder="Living Room&#10;Bathrooms&#10;Kitchen"></textarea>
                                <p class="text-xs text-slate-500 mt-1.5">Rotates automatically based on periods elapsed since creation.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Accordion 2: Notes & Gratitude -->
            <div class="bg-white rounded-xl border border-dashboard-border shadow-sm overflow-hidden">
                <button class="w-full px-6 py-4 flex items-center justify-between bg-white hover:bg-slate-50 transition-colors" onclick="toggleAccordion('notesAccordion')">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded bg-yellow-50 text-yellow-600 flex items-center justify-center">
                            <i class="ph ph-note-pencil text-lg"></i>
                        </div>
                        <span class="font-semibold text-dashboard-text">Notes & Gratitude</span>
                    </div>
                    <i class="ph ph-caret-down text-dashboard-muted accordion-icon" id="notesAccordion-icon"></i>
                </button>
                <div id="notesAccordion-content" class="accordion-content px-6 border-t border-dashboard-border bg-slate-50/50">
                    <div class="flex flex-col gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-dashboard-muted uppercase tracking-wider mb-2">Thoughts, focuses, or gratitude for this period</label>
                            <textarea id="notesInput" rows="4" class="w-full p-3 border border-slate-300 rounded-lg bg-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-yellow-400 focus:border-yellow-400 text-sm transition-shadow resize-none"></textarea>
                        </div>
                        <button id="saveNotesBtn" onclick="saveNotes()" class="w-full sm:w-auto self-end bg-slate-900 hover:bg-slate-800 text-white px-6 py-2.5 rounded-lg font-medium text-sm transition-colors shadow-sm whitespace-nowrap">
                            Save Note
                        </button>
                        <div id="notesHistory" class="mt-2 flex flex-col gap-3 max-h-60 overflow-y-auto pr-2 custom-scrollbar">
                            <!-- Injected via JS -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Accordion 3: Settings -->
            <div class="bg-white rounded-xl border border-dashboard-border shadow-sm overflow-hidden">
                <button class="w-full px-6 py-4 flex items-center justify-between bg-white hover:bg-slate-50 transition-colors" onclick="toggleAccordion('settingsAccordion')">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded bg-slate-100 text-slate-600 flex items-center justify-center">
                            <i class="ph ph-gear text-lg"></i>
                        </div>
                        <span class="font-semibold text-dashboard-text">Settings</span>
                    </div>
                    <i class="ph ph-caret-down text-dashboard-muted accordion-icon" id="settingsAccordion-icon"></i>
                </button>
                <div id="settingsAccordion-content" class="accordion-content px-6 border-t border-dashboard-border bg-slate-50/50">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center p-4 bg-white border border-red-100 rounded-lg">
                        <div>
                            <h4 class="text-sm font-semibold text-dashboard-text">Danger Zone</h4>
                            <p class="text-xs text-dashboard-muted mt-1">Permanently delete all trackers and historical data.</p>
                        </div>
                        <button onclick="clearAllData()" class="mt-3 sm:mt-0 px-4 py-2 bg-red-50 text-dashboard-danger hover:bg-red-100 hover:text-red-700 rounded-lg text-sm font-medium transition-colors border border-red-200">
                            Clear Matrix Database
                        </button>
                    </div>
                </div>
            </div>

        </section>
    </main>

    <script>
        // --- CONSTANTS & GLOBALS ---
        const STORAGE_KEY = 'chores_pro_matrix';
        const NOTES_KEY = 'chores_pro_matrix_notes';
        const DAYS_TO_SHOW = 14;  // Daily columns
        const WEEKS_TO_SHOW = 12; // Weekly columns
        
        let chores = [];
        let notesLog = {};
        let activeType = 'household'; 

        // --- DATE UTILS ---
        function formatDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // Get Monday of the week for a given date
        function getMonday(d) {
            const date = new Date(d);
            date.setHours(0,0,0,0);
            const day = date.getDay();
            const diff = date.getDate() - day + (day === 0 ? -6 : 1);
            return new Date(date.setDate(diff));
        }

        // Generate arrays of dates for the headers
        function getPastDates(numDays) {
            const dates = [];
            const today = new Date();
            for (let i = numDays - 1; i >= 0; i--) {
                const d = new Date(today);
                d.setDate(today.getDate() - i);
                dates.push(formatDate(d));
            }
            return dates;
        }

        function getPastWeeks(numWeeks) {
            const weeks = [];
            const currentMonday = getMonday(new Date());
            for (let i = numWeeks - 1; i >= 0; i--) {
                const d = new Date(currentMonday);
                d.setDate(d.getDate() - (i * 7));
                weeks.push(formatDate(d));
            }
            return weeks;
        }

        // Calculate ISO Week (Danish Standard)
        function getISOWeek(dateStr) {
            const d = new Date(dateStr + 'T12:00:00');
            const date = new Date(d.getTime());
            date.setHours(0, 0, 0, 0);
            date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
            const week1 = new Date(date.getFullYear(), 0, 4);
            return 1 + Math.round(((date.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
        }

        // Math elapsed
        function getWeeksElapsed(startStr, endStr) {
            const start = new Date(startStr + 'T12:00:00');
            const end = new Date(endStr + 'T12:00:00');
            return Math.floor((end - start) / (1000 * 60 * 60 * 24 * 7));
        }

        function getDaysElapsed(startStr, endStr) {
            const start = new Date(startStr + 'T12:00:00');
            const end = new Date(endStr + 'T12:00:00');
            return Math.floor((end - start) / (1000 * 60 * 60 * 24));
        }

        // Rotation Logic
        function getRotationTask(chore, targetDateStr) {
            if (!chore.isRotating || !chore.rotation || chore.rotation.length === 0) return null;
            if (targetDateStr < chore.createdAt) return null;
            
            let elapsed = 0;
            if (chore.type === 'daily') {
                elapsed = getDaysElapsed(chore.createdAt, targetDateStr);
            } else {
                elapsed = getWeeksElapsed(chore.createdAt, targetDateStr);
            }
            
            if (elapsed < 0) return null;
            return chore.rotation[elapsed % chore.rotation.length];
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        }

        // --- GLOBAL ACTION: Toggle History ---
        // Attaching to window ensures it works perfectly from the injected HTML
        window.toggleHistory = function(choreId, dateStr) {
            const chore = chores.find(h => h.id === choreId);
            if (!chore) return;
            if (dateStr < chore.createdAt) return;
            
            if (!chore.history) chore.history = {};

            if (chore.history[dateStr]) {
                delete chore.history[dateStr];
            } else {
                chore.history[dateStr] = true;
            }
            saveData();
        };

        window.deleteChore = function(id) {
            if(confirm("Permanently delete this chore row?")) {
                chores = chores.filter(h => h.id !== id);
                saveData();
            }
        };

        // --- INITIALIZATION ---
        function init() {
            const now = new Date();
            document.getElementById('headerDate').textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });

            try {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data && data !== "undefined" && data !== "null") chores = JSON.parse(data) || [];
                
                const nData = localStorage.getItem(NOTES_KEY);
                if (nData && nData !== "undefined" && nData !== "null") notesLog = JSON.parse(nData) || {};
            } catch (err) {
                chores = [];
                notesLog = {};
            }

            document.getElementById('choreInput')?.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleAddChore();
            });

            setActiveType('household');
            renderNotesHistory();
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(chores));
            renderMatrix();
        }

        window.setActiveType = function(type) {
            activeType = type;
            
            const btnIds = ['toggleDailyBtn', 'toggleHouseholdBtn', 'toggleAdminBtn', 'toggleMaintenanceBtn'];
            btnIds.forEach(id => {
                const btn = document.getElementById(id);
                if(btn) btn.className = "px-4 py-1.5 rounded-md text-sm font-medium transition-all text-dashboard-muted hover:text-dashboard-text whitespace-nowrap";
            });

            let activeBtn = null;
            if (type === 'daily') activeBtn = document.getElementById('toggleDailyBtn');
            else if (type === 'household') activeBtn = document.getElementById('toggleHouseholdBtn');
            else if (type === 'admin') activeBtn = document.getElementById('toggleAdminBtn');
            else activeBtn = document.getElementById('toggleMaintenanceBtn');

            if (activeBtn) {
                activeBtn.className = "px-4 py-1.5 rounded-md text-sm font-medium transition-all bg-white text-dashboard-text shadow-sm ring-1 ring-slate-900/5 whitespace-nowrap";
            }

            renderMatrix();
        }

        // --- RENDER MATRIX ---
        function renderMatrix() {
            const container = document.getElementById('matrixContainer');
            if (!container) return;

            const filteredChores = chores.filter(c => c.type === activeType);
            const isDaily = activeType === 'daily';
            
            // Get columns (dates)
            const targetDates = isDaily ? getPastDates(DAYS_TO_SHOW) : getPastWeeks(WEEKS_TO_SHOW);
            const currentDateStr = isDaily ? formatDate(new Date()) : formatDate(getMonday(new Date()));

            // Colors
            let activeColorClass = 'bg-dashboard-success border-dashboard-success text-white';
            let hoverColorClass = 'hover:border-dashboard-success';
            if (activeType === 'daily') {
                activeColorClass = 'bg-amber-500 border-amber-500 text-white';
                hoverColorClass = 'hover:border-amber-500';
            } else if (activeType === 'admin') {
                activeColorClass = 'bg-blue-500 border-blue-500 text-white';
                hoverColorClass = 'hover:border-blue-500';
            }

            if (filteredChores.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-16 text-center">
                        <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mb-4 text-slate-400">
                            <i class="ph ph-squares-four text-3xl"></i>
                        </div>
                        <h3 class="text-lg font-semibold text-dashboard-text">No Rows Here</h3>
                        <p class="text-sm text-dashboard-muted mt-1">Add a ${activeType} chore to start the matrix.</p>
                    </div>`;
                return;
            }

            // Build Table
            let html = `<table class="w-full text-left border-collapse border-b border-slate-200 min-w-max">`;
            
            // 1. Header Row
            html += `<thead><tr>`;
            html += `<th class="sticky-header p-4 text-xs font-bold uppercase tracking-wider text-slate-500 border-b border-r border-slate-200 min-w-[200px] shadow-[2px_0_5px_-2px_rgba(0,0,0,0.05)]">Chore Name</th>`;
            
            targetDates.forEach(dateStr => {
                const d = new Date(dateStr + 'T12:00:00');
                const isCurrent = dateStr === currentDateStr;
                let headerText = '';
                
                if (isDaily) {
                    headerText = `<div class="text-[10px] text-slate-400 font-medium">${d.toLocaleDateString('en-US', {weekday: 'short'})}</div>
                                  <div class="text-sm font-bold text-slate-700">${d.getDate()}</div>`;
                } else {
                    // Danish Uge format
                    headerText = `<div class="text-[10px] text-slate-400 font-medium">${d.toLocaleDateString('en-US', {month: 'short'})}</div>
                                  <div class="text-sm font-bold text-slate-700 whitespace-nowrap">Uge ${getISOWeek(dateStr)}</div>`;
                }

                html += `<th class="p-3 text-center border-b border-slate-200 ${isCurrent ? 'bg-slate-100' : ''}">
                            ${headerText}
                         </th>`;
            });
            html += `</tr></thead><tbody>`;

            // 2. Body Rows
            filteredChores.forEach(chore => {
                const history = chore.history || {};
                
                html += `<tr class="hover:bg-slate-50/50 transition-colors">`;
                
                // Sticky Col: Chore Name + Rotation Info
                let rotationHTML = '';
                if (chore.isRotating) {
                    const currentTask = getRotationTask(chore, currentDateStr);
                    if (currentTask) {
                        rotationHTML = `<div class="text-xs text-dashboard-muted mt-1 truncate max-w-[180px]" title="${escapeHTML(currentTask)}">
                                            <i class="ph ph-arrows-clockwise text-[10px]"></i> ${escapeHTML(currentTask)}
                                        </div>`;
                    }
                }

                html += `
                    <td class="sticky-col p-4 border-b border-r border-slate-200 bg-white">
                        <div class="flex justify-between items-start gap-2">
                            <div>
                                <div class="text-sm font-bold text-dashboard-text">${escapeHTML(chore.name)}</div>
                                ${rotationHTML}
                            </div>
                            <button onclick="deleteChore('${chore.id}')" class="text-slate-300 hover:text-red-500 mt-0.5">
                                <i class="ph ph-trash"></i>
                            </button>
                        </div>
                    </td>
                `;

                // Columns: Checkboxes
                targetDates.forEach(dateStr => {
                    const isCompleted = !!history[dateStr];
                    const isBeforeCreation = dateStr < chore.createdAt;
                    const isCurrent = dateStr === currentDateStr;
                    
                    let btnClass = "w-8 h-8 rounded border flex items-center justify-center mx-auto transition-all ";
                    let iconHtml = '';

                    if (isBeforeCreation) {
                        btnClass += "bg-slate-50 border-slate-100 cursor-not-allowed";
                        iconHtml = `<div class="w-1.5 h-1.5 rounded-full bg-slate-200"></div>`;
                    } else {
                        if (isCompleted) {
                            btnClass += `${activeColorClass} check-anim shadow-sm`;
                            iconHtml = `<i class="ph-bold ph-check text-white"></i>`;
                        } else {
                            btnClass += `bg-white border-slate-300 ${hoverColorClass} cursor-pointer hover:bg-slate-50`;
                            if (isCurrent) btnClass += ` ring-2 ring-slate-100`;
                        }
                    }

                    // Add onclick only if valid
                    const onClickStr = !isBeforeCreation ? `onclick="window.toggleHistory('${chore.id}', '${dateStr}')"` : '';

                    html += `<td class="p-2 border-b border-slate-200 ${isCurrent ? 'bg-slate-50' : ''}">
                                <button class="${btnClass}" ${onClickStr}>${iconHtml}</button>
                             </td>`;
                });

                html += `</tr>`;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;

            // Scroll to the far right (most recent day/week)
            setTimeout(() => {
                container.scrollLeft = container.scrollWidth;
            }, 10);
        }

        // --- ACCORDION LOGIC ---
        window.toggleAccordion = function(id) {
            const content = document.getElementById(`${id}-content`);
            const icon = document.getElementById(`${id}-icon`);
            if (!content || !icon) return;
            if (content.classList.contains('open')) {
                content.classList.remove('open');
                icon.classList.remove('open');
            } else {
                content.classList.add('open');
                icon.classList.add('open');
            }
        };

        window.toggleRotationInput = function() {
            const isChecked = document.getElementById('isRotatingCheck').checked;
            const container = document.getElementById('rotationInputContainer');
            if (isChecked) {
                container.classList.remove('hidden');
                container.classList.add('block');
            } else {
                container.classList.add('hidden');
                container.classList.remove('block');
            }
        };

        window.handleAddChore = function() {
            const input = document.getElementById('choreInput');
            if (!input) return;
            const name = input.value.trim();
            if (!name) return;

            const typeRadios = document.getElementsByName('choreType');
            let selectedType = 'daily';
            for (let radio of typeRadios) {
                if (radio.checked) { selectedType = radio.value; break; }
            }
            
            let isRotating = document.getElementById('isRotatingCheck').checked;
            let rotationItems = [];
            if (isRotating) {
                const rawRotations = document.getElementById('rotationInput').value;
                rotationItems = rawRotations.split('\n').map(item => item.trim()).filter(item => item.length > 0);
                if (rotationItems.length === 0) isRotating = false;
            }

            const newId = (window.crypto && window.crypto.randomUUID) ? window.crypto.randomUUID() : Date.now().toString();
            const createdDate = selectedType === 'daily' ? formatDate(new Date()) : formatDate(getMonday(new Date()));

            chores.push({
                id: newId, name: name, type: selectedType, history: {},
                createdAt: createdDate, isRotating: isRotating, rotation: rotationItems
            });
            
            input.value = '';
            document.getElementById('isRotatingCheck').checked = false;
            document.getElementById('rotationInput').value = '';
            toggleRotationInput();
            
            setActiveType(selectedType);
            
            const content = document.getElementById('addChoreAccordion-content');
            if (content && content.classList.contains('open')) toggleAccordion('addChoreAccordion');

            saveData();
        };

        // --- NOTES LOGIC ---
        window.saveNotes = function() {
            const input = document.getElementById('notesInput');
            if (!input) return;
            const text = input.value.trim();
            if (!text) return;

            const currentWeekStr = formatDate(getMonday(new Date()));
            if (!notesLog) notesLog = {};
            notesLog[currentWeekStr] = text;
            localStorage.setItem(NOTES_KEY, JSON.stringify(notesLog));

            const btn = document.getElementById('saveNotesBtn');
            if (btn) {
                const originalText = btn.innerHTML;
                btn.innerHTML = `<i class="ph ph-check mr-1"></i> Saved`;
                btn.classList.replace('bg-slate-900', 'bg-dashboard-success');
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.replace('bg-dashboard-success', 'bg-slate-900');
                }, 2000);
            }
            renderNotesHistory();
        };

        function renderNotesHistory() {
            const container = document.getElementById('notesHistory');
            if (!container) return;
            container.innerHTML = '';
            
            const weeks = Object.keys(notesLog).sort((a, b) => new Date(b) - new Date(a));
            if (weeks.length === 0) {
                container.innerHTML = '<div class="text-sm text-dashboard-muted italic py-4 text-center bg-white rounded-lg border border-slate-200">No notes saved yet.</div>';
            } else {
                weeks.forEach(weekStr => {
                    const entry = document.createElement('div');
                    entry.className = 'bg-white p-4 rounded-lg border border-slate-200 shadow-sm flex flex-col gap-1';
                    const d = new Date(weekStr + 'T12:00:00');
                    entry.innerHTML = `
                        <div class="text-xs font-semibold text-yellow-600 tracking-wide uppercase">Uge ${getISOWeek(weekStr)} (${d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })})</div>
                        <div class="text-sm text-dashboard-text whitespace-pre-wrap">${escapeHTML(notesLog[weekStr])}</div>
                    `;
                    container.appendChild(entry);
                });
            }
            const currentWeekStr = formatDate(getMonday(new Date()));
            const input = document.getElementById('notesInput');
            if (input && notesLog[currentWeekStr]) input.value = notesLog[currentWeekStr];
        }

        window.clearAllData = function() {
            if(confirm("CRITICAL WARNING: Delete ALL matrix data?")) {
                chores = [];
                notesLog = {};
                localStorage.removeItem(STORAGE_KEY);
                localStorage.removeItem(NOTES_KEY);
                renderMatrix();
                renderNotesHistory();
                toggleAccordion('settingsAccordion');
            }
        };

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
